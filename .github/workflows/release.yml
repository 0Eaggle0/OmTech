# Push a tag like v1.2.1 → builds a signed APK and publishes a GitHub Release.
# The app checks the latest release on start and offers to install it in place.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   KEYSTORE_BASE64   base64 of android/app/release.jks
#   KEYSTORE_PASSWORD store password
#   KEY_ALIAS         key alias
#   KEY_PASSWORD      key password
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match pubspec version
        run: |
          v=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != pubspec $v"; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'
          channel: stable
          cache: true

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          cat > android/key.properties <<EOF
          storeFile=release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release

      - run: mv build/app/outputs/flutter-apk/app-release.apk OmTech-${{ github.ref_name }}.apk

      - uses: softprops/action-gh-release@v2
        with:
          files: OmTech-${{ github.ref_name }}.apk
          generate_release_notes: true
